<!DOCTYPE html>
<html lang="en">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0">
  <title>work-for-the-trees</title>
  <script src="https://cdn.jsdelivr.net/npm/marked/lib/marked.umd.js"></script>
  <style>
    :root {
      --bg: #0d1117;
      --bg-card: #161b22;
      --bg-card-main: #0d1117;
      --border: #30363d;
      --border-main: #21262d;
      --text: #e6edf3;
      --text-muted: #7d8590;
      --text-dim: #484f58;
      --status-no-plan: #484f58;
      --status-planning: #d29922;
      --status-in-progress: #3fb950;
      --status-idle: #f85149;
      --status-merged: #8957e5;
      --font-mono: "SF Mono", "Cascadia Code", "Fira Code", "JetBrains Mono", monospace;
    }

    * { box-sizing: border-box; margin: 0; padding: 0; }

    body {
      background: var(--bg);
      color: var(--text);
      font-family: var(--font-mono);
      font-size: 14px;
      line-height: 1.5;
      padding: 16px;
    }

    header {
      display: flex;
      align-items: center;
      gap: 12px;
      padding: 8px 0 24px;
      border-bottom: 1px solid var(--border);
      margin-bottom: 24px;
    }

    header h1 { font-size: 16px; font-weight: 600; }

    .status-dot {
      width: 8px;
      height: 8px;
      border-radius: 50%;
      display: inline-block;
      background: var(--status-idle);
      flex-shrink: 0;
    }

    .status-dot.connected { background: var(--status-in-progress); }

    #last-updated {
      margin-left: auto;
      display: flex;
      align-items: center;
      gap: 10px;
      background: var(--bg-card);
      border: 1px solid var(--border);
      border-radius: 6px;
      padding: 4px 10px;
      font-size: 11px;
      color: var(--text-dim);
      flex-shrink: 0;
    }

    #last-updated .poll-label {
      color: var(--text-muted);
    }

    #last-updated .poll-divider {
      color: var(--border);
    }

    .repo-pills {
      display: flex;
      gap: 4px;
      flex-wrap: wrap;
    }

    .repo-pill {
      background: none;
      border: 1px solid var(--border);
      border-radius: 12px;
      color: var(--text-muted);
      cursor: pointer;
      font-family: var(--font-mono);
      font-size: 12px;
      padding: 2px 10px;
    }

    .repo-pill:hover { color: var(--text); border-color: var(--text-dim); }

    .repo-pill.active {
      background: var(--bg-card);
      color: var(--text);
      border-color: var(--text-dim);
    }

    .repo-heading {
      grid-column: 1 / -1;
      font-size: 13px;
      color: var(--text-dim);
      padding: 8px 0 0;
      border-top: 1px solid var(--border);
      margin-top: 4px;
    }

    .repo-heading:first-child {
      border-top: none;
      margin-top: 0;
    }

    .card-grid {
      display: grid;
      gap: 16px;
      grid-template-columns: repeat(auto-fill, minmax(400px, 1fr));
    }

    @media (max-width: 480px) {
      .card-grid { grid-template-columns: 1fr; }
    }

    .card {
      background: var(--bg-card);
      border: 1px solid var(--border);
      border-radius: 8px;
      padding: 16px;
      display: flex;
      flex-direction: column;
      gap: 12px;
    }

    .card.main-worktree {
      opacity: 0.5;
      border-color: var(--border-main);
      background: var(--bg-card-main);
    }

    .card.main-worktree.main-behind {
      opacity: 1;
      border-left: 3px solid var(--status-planning);
    }

    .behind-remote {
      font-size: 12px;
      color: var(--status-planning);
      margin-top: 2px;
    }

    .pr-link {
      font-size: 12px;
      margin-top: 2px;
      text-decoration: none;
      display: block;
    }

    .pr-link:hover { text-decoration: underline; }
    .pr-link.pr-open { color: var(--status-in-progress); }
    .pr-link.pr-merged { color: var(--status-merged); }
    .pr-link.pr-closed { color: var(--status-idle); }

    .card-header {
      display: flex;
      justify-content: space-between;
      align-items: flex-start;
      gap: 8px;
    }

    .branch-name {
      font-size: 16px;
      font-weight: 600;
      word-break: break-all;
    }

    .base-branch { font-size: 12px; color: var(--text-muted); margin-top: 2px; }

    .status-badge {
      display: inline-block;
      padding: 2px 8px;
      border-radius: 12px;
      font-size: 11px;
      font-weight: 600;
      text-transform: uppercase;
      letter-spacing: 0.5px;
      white-space: nowrap;
      flex-shrink: 0;
    }

    .status-no-plan {
      background: color-mix(in srgb, var(--status-no-plan) 20%, transparent);
      color: var(--status-no-plan);
    }
    .status-planning {
      background: color-mix(in srgb, var(--status-planning) 20%, transparent);
      color: var(--status-planning);
    }
    .status-in-progress {
      background: color-mix(in srgb, var(--status-in-progress) 20%, transparent);
      color: var(--status-in-progress);
    }
    .status-idle {
      background: color-mix(in srgb, var(--status-idle) 20%, transparent);
      color: var(--status-idle);
    }
    .status-merged {
      background: color-mix(in srgb, var(--status-merged) 20%, transparent);
      color: var(--status-merged);
    }

    .card.merged-worktree {
      border-left: 3px solid var(--status-merged);
    }

    .uncommitted {
      font-size: 12px;
      color: var(--text-muted);
      display: flex;
      gap: 8px;
    }

    .last-commit-time { font-size: 11px; color: var(--text-dim); }

    .divergence { font-size: 12px; color: var(--text-muted); }

    .divergence-summary {
      display: flex;
      align-items: center;
      gap: 12px;
    }

    .file-changes { display: flex; gap: 8px; }
    .file-added { color: #3fb950; }
    .file-modified { color: #d29922; }
    .file-deleted { color: #f85149; }

    .commit-list {
      list-style: none;
      max-height: 120px;
      overflow-y: auto;
      margin-top: 6px;
    }

    .commit-list li {
      padding: 2px 0;
      border-bottom: 1px solid var(--border);
      color: var(--text-muted);
      font-size: 12px;
    }

    .commit-list li:last-child { border-bottom: none; }

    .commit-hash {
      color: var(--text-dim);
      font-size: 11px;
      margin-right: 6px;
    }

    .plan-section {
      border-top: 1px solid var(--border);
      padding-top: 8px;
    }

    .plan-toggle {
      background: none;
      border: none;
      color: var(--text-muted);
      cursor: pointer;
      font-family: var(--font-mono);
      font-size: 12px;
      display: flex;
      align-items: center;
      gap: 4px;
      padding: 4px 0;
    }

    .plan-toggle:hover { color: var(--text); }

    .plan-toggle .arrow {
      transition: transform 0.15s ease;
      display: inline-block;
    }

    .plan-toggle .arrow.expanded { transform: rotate(90deg); }

    .card.plan-expanded {
      grid-column: 1 / -1;
    }

    .plan-content {
      display: none;
      padding: 12px 16px;
      background: var(--bg);
      border-radius: 4px;
      margin-top: 8px;
      font-size: 13px;
    }

    .plan-content.expanded { display: block; }

    .plan-content h1, .plan-content h2, .plan-content h3 {
      color: var(--text);
      margin: 8px 0 4px;
      font-size: 14px;
    }
    .plan-content h1 { font-size: 16px; }
    .plan-content p { margin: 4px 0; color: var(--text-muted); }
    .plan-content ul, .plan-content ol { padding-left: 20px; color: var(--text-muted); }
    .plan-content li { margin: 2px 0; }
    .plan-content code {
      background: var(--bg-card);
      padding: 1px 4px;
      border-radius: 3px;
      font-size: 12px;
    }
    .plan-content pre {
      background: var(--bg-card);
      padding: 8px;
      border-radius: 4px;
      overflow-x: auto;
      margin: 4px 0;
    }
    .plan-content pre code { background: none; padding: 0; }

    .empty-state {
      text-align: center;
      color: var(--text-dim);
      padding: 80px 16px;
      font-size: 14px;
    }
  </style>
</head>
<body>
  <header>
    <h1>work-for-the-trees</h1>
    <span id="connection-status" class="status-dot"></span>
    <div id="repo-pills" class="repo-pills"></div>
    <div id="last-updated"></div>
  </header>

  <main id="grid" class="card-grid"></main>

  <div id="empty-state" class="empty-state" style="display:none">
    <p>No worktrees found. Waiting for data...</p>
  </div>

  <script>
    (function () {
      const grid = document.getElementById("grid");
      const emptyState = document.getElementById("empty-state");
      const connectionDot = document.getElementById("connection-status");
      const repoPillsEl = document.getElementById("repo-pills");
      const lastUpdatedEl = document.getElementById("last-updated");
      const expandedPlans = new Set();
      let currentState = null;
      let activeRepo = "all"; // "all" or a repoName

      function connect() {
        const protocol = location.protocol === "https:" ? "wss:" : "ws:";
        const ws = new WebSocket(`${protocol}//${location.host}/ws`);

        ws.onopen = () => connectionDot.classList.add("connected");

        ws.onclose = () => {
          connectionDot.classList.remove("connected");
          setTimeout(connect, 2000);
        };

        ws.onerror = () => ws.close();

        ws.onmessage = (event) => {
          try {
            currentState = JSON.parse(event.data);
            render(currentState);
          } catch (err) {
            console.error("Failed to parse message:", err);
          }
        };
      }

      function getRepoNames(state) {
        const names = new Set();
        for (const wt of state.worktrees) names.add(wt.repoName);
        return [...names];
      }

      function renderPills(repoNames) {
        if (repoNames.length <= 1) {
          repoPillsEl.innerHTML = repoNames.length === 1
            ? `<span style="color:var(--text-muted);font-size:12px">${esc(repoNames[0])}</span>`
            : "";
          return;
        }

        const pills = [`<button class="repo-pill${activeRepo === "all" ? " active" : ""}" data-repo="all">All</button>`];
        for (const name of repoNames) {
          const active = activeRepo === name ? " active" : "";
          pills.push(`<button class="repo-pill${active}" data-repo="${esc(name)}">${esc(name)}</button>`);
        }
        repoPillsEl.innerHTML = pills.join("");

        repoPillsEl.querySelectorAll(".repo-pill").forEach((btn) => {
          btn.addEventListener("click", () => {
            activeRepo = btn.dataset.repo;
            if (currentState) render(currentState);
          });
        });
      }

      function render(state) {
        const gitTime = new Date(state.updatedAt).toLocaleTimeString();
        const remoteTime = state.remoteCheckedAt
          ? new Date(state.remoteCheckedAt).toLocaleTimeString()
          : "pending\u2026";
        lastUpdatedEl.innerHTML =
          `<span><span class="poll-label">git</span> ${gitTime}</span>` +
          `<span class="poll-divider">|</span>` +
          `<span><span class="poll-label">remote</span> ${remoteTime}</span>`;

        const repoNames = getRepoNames(state);
        renderPills(repoNames);

        const filtered = activeRepo === "all"
          ? state.worktrees
          : state.worktrees.filter((wt) => wt.repoName === activeRepo);

        if (!filtered || filtered.length === 0) {
          grid.style.display = "none";
          emptyState.style.display = "block";
          return;
        }

        grid.style.display = "grid";
        emptyState.style.display = "none";

        // Group by repo, sorted within each group
        const grouped = {};
        for (const wt of filtered) {
          if (!grouped[wt.repoName]) grouped[wt.repoName] = [];
          grouped[wt.repoName].push(wt);
        }

        const statusOrder = { "in-progress": 0, "planning": 1, "idle": 2, "no-plan": 3, "merged": 4 };
        const sortWorktrees = (list) => [...list].sort((a, b) => {
          if (a.isMainWorktree) return 1;
          if (b.isMainWorktree) return -1;
          return (statusOrder[a.status] ?? 4) - (statusOrder[b.status] ?? 4);
        });

        const showHeadings = repoNames.length > 1 && activeRepo === "all";
        let html = "";
        for (const repoName of Object.keys(grouped)) {
          if (showHeadings) {
            html += `<div class="repo-heading">${esc(repoName)}</div>`;
          }
          html += sortWorktrees(grouped[repoName]).map(renderCard).join("");
        }

        grid.innerHTML = html;

        grid.querySelectorAll(".plan-toggle").forEach((btn) => {
          btn.addEventListener("click", () => {
            const key = btn.dataset.key;
            const content = btn.nextElementSibling;
            const arrow = btn.querySelector(".arrow");
            const card = btn.closest(".card");

            if (expandedPlans.has(key)) {
              expandedPlans.delete(key);
              content.classList.remove("expanded");
              arrow.classList.remove("expanded");
            } else {
              expandedPlans.add(key);
              content.classList.add("expanded");
              arrow.classList.add("expanded");
            }

            const hasExpanded = card.querySelector(".plan-content.expanded");
            card.classList.toggle("plan-expanded", !!hasExpanded);
          });
        });
      }

      function renderCard(wt) {
        const behindCount = wt.behindRemote ?? 0;
        const mainClass = wt.isMainWorktree ? " main-worktree" : "";
        const mainBehindClass = wt.isMainWorktree && behindCount !== 0 ? " main-behind" : "";
        const mergedClass = wt.status === "merged" ? " merged-worktree" : "";
        const hasExpandedPlan = wt.planFiles.some(
          (p) => expandedPlans.has(wt.branch + ":" + p.filename)
        );
        const expandedCardClass = hasExpandedPlan ? " plan-expanded" : "";
        const statusClass = "status-" + wt.status;
        const statusLabels = {
          "no-plan": "No plan",
          "planning": "Planning",
          "in-progress": "In progress",
          "idle": "Idle",
          "merged": "Merged",
        };

        const behindRemoteHtml = behindCount === -1
          ? `<div class="behind-remote">behind origin/${esc(wt.branch)} — pull to update</div>`
          : behindCount > 0
            ? `<div class="behind-remote">${behindCount} commit${behindCount !== 1 ? "s" : ""} behind origin/${esc(wt.branch)} — pull to update</div>`
            : "";

        const prHtml = wt.pr
          ? `<a class="pr-link pr-${wt.pr.state}" href="${esc(wt.pr.url)}" target="_blank">PR #${wt.pr.number}: ${esc(wt.pr.title)}</a>`
          : "";

        return `
          <div class="card${mainClass}${mainBehindClass}${mergedClass}${expandedCardClass}">
            <div class="card-header">
              <div>
                <div class="branch-name">${esc(wt.branch)}</div>
                ${wt.baseBranch ? `<div class="base-branch">from ${esc(wt.baseBranch)}</div>` : ""}
                ${prHtml}
                ${behindRemoteHtml}
              </div>
              <span class="status-badge ${statusClass}">${statusLabels[wt.status] || wt.status}</span>
            </div>
            ${renderUncommitted(wt)}
            ${renderDivergence(wt)}
            ${renderPlans(wt)}
          </div>
        `;
      }

      function renderUncommitted(wt) {
        const u = wt.uncommitted;
        if (!u || (u.staged === 0 && u.unstaged === 0 && u.untracked === 0)) return "";

        const parts = [];
        if (u.staged > 0) parts.push(`<span class="file-added">${u.staged} staged</span>`);
        if (u.unstaged > 0) parts.push(`<span class="file-modified">${u.unstaged} modified</span>`);
        if (u.untracked > 0) parts.push(`<span class="file-deleted">${u.untracked} untracked</span>`);

        return `<div class="uncommitted">${parts.join(" ")}</div>`;
      }

      function renderDivergence(wt) {
        if (wt.commitsAhead === 0) return "";

        const fc = wt.fileChanges;
        const parts = [];
        if (fc.added > 0) parts.push(`<span class="file-added">+${fc.added}</span>`);
        if (fc.modified > 0) parts.push(`<span class="file-modified">~${fc.modified}</span>`);
        if (fc.deleted > 0) parts.push(`<span class="file-deleted">-${fc.deleted}</span>`);

        const commits = wt.commits.map((c) =>
          `<li><span class="commit-hash">${c.hash.slice(0, 7)}</span>${esc(c.message)}</li>`
        ).join("");

        const timeAgo = wt.lastCommitTimestamp ? formatRelativeTime(wt.lastCommitTimestamp) : "";

        return `
          <div class="divergence">
            <div class="divergence-summary">
              <span>${wt.commitsAhead} commit${wt.commitsAhead !== 1 ? "s" : ""} ahead</span>
              ${parts.length ? `<span class="file-changes">${parts.join(" ")} files</span>` : ""}
              ${timeAgo ? `<span class="last-commit-time">last commit ${timeAgo}</span>` : ""}
            </div>
            <ul class="commit-list">${commits}</ul>
          </div>
        `;
      }

      function formatRelativeTime(isoString) {
        const seconds = Math.floor((Date.now() - new Date(isoString).getTime()) / 1000);
        if (seconds < 60) return "just now";
        const minutes = Math.floor(seconds / 60);
        if (minutes < 60) return minutes + "m ago";
        const hours = Math.floor(minutes / 60);
        if (hours < 24) return hours + "h ago";
        const days = Math.floor(hours / 24);
        return days + "d ago";
      }

      function renderPlans(wt) {
        if (wt.planFiles.length === 0) return "";

        return wt.planFiles.map((plan) => {
          const key = wt.branch + ":" + plan.filename;
          const isExpanded = expandedPlans.has(key);
          const expandedClass = isExpanded ? " expanded" : "";

          return `
            <div class="plan-section">
              <button class="plan-toggle" data-key="${esc(key)}">
                <span class="arrow${expandedClass}">&#9654;</span>
                ${esc(plan.filename)}
              </button>
              <div class="plan-content${expandedClass}">
                ${marked.parse(plan.content)}
              </div>
            </div>
          `;
        }).join("");
      }

      function esc(str) {
        const div = document.createElement("div");
        div.textContent = str;
        return div.innerHTML;
      }

      connect();
    })();
  </script>
</body>
</html>
