<!DOCTYPE html>
<html lang="en">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0">
  <title>work-for-the-trees</title>
  <script src="https://cdn.jsdelivr.net/npm/marked/lib/marked.umd.js"></script>
  <style>
    :root {
      --bg: #0d1117;
      --bg-card: #161b22;
      --bg-card-main: #0d1117;
      --border: #30363d;
      --border-main: #21262d;
      --text: #e6edf3;
      --text-muted: #7d8590;
      --text-dim: #484f58;
      --status-no-plan: #484f58;
      --status-planning: #d29922;
      --status-in-progress: #3fb950;
      --status-idle: #f85149;
      --font-mono: "SF Mono", "Cascadia Code", "Fira Code", "JetBrains Mono", monospace;
    }

    * { box-sizing: border-box; margin: 0; padding: 0; }

    body {
      background: var(--bg);
      color: var(--text);
      font-family: var(--font-mono);
      font-size: 14px;
      line-height: 1.5;
      padding: 16px;
    }

    header {
      display: flex;
      align-items: center;
      gap: 12px;
      padding: 8px 0 24px;
      border-bottom: 1px solid var(--border);
      margin-bottom: 24px;
    }

    header h1 { font-size: 16px; font-weight: 600; }

    .status-dot {
      width: 8px;
      height: 8px;
      border-radius: 50%;
      display: inline-block;
      background: var(--status-idle);
      flex-shrink: 0;
    }

    .status-dot.connected { background: var(--status-in-progress); }

    #repo-path { color: var(--text-muted); font-size: 12px; }
    #last-updated { color: var(--text-dim); font-size: 12px; margin-left: auto; }

    .card-grid {
      display: grid;
      gap: 16px;
      grid-template-columns: repeat(auto-fill, minmax(400px, 1fr));
    }

    @media (max-width: 480px) {
      .card-grid { grid-template-columns: 1fr; }
    }

    .card {
      background: var(--bg-card);
      border: 1px solid var(--border);
      border-radius: 8px;
      padding: 16px;
      display: flex;
      flex-direction: column;
      gap: 12px;
    }

    .card.main-worktree {
      opacity: 0.5;
      border-color: var(--border-main);
      background: var(--bg-card-main);
    }

    .card-header {
      display: flex;
      justify-content: space-between;
      align-items: flex-start;
      gap: 8px;
    }

    .branch-name {
      font-size: 16px;
      font-weight: 600;
      word-break: break-all;
    }

    .base-branch { font-size: 12px; color: var(--text-muted); margin-top: 2px; }

    .status-badge {
      display: inline-block;
      padding: 2px 8px;
      border-radius: 12px;
      font-size: 11px;
      font-weight: 600;
      text-transform: uppercase;
      letter-spacing: 0.5px;
      white-space: nowrap;
      flex-shrink: 0;
    }

    .status-no-plan {
      background: color-mix(in srgb, var(--status-no-plan) 20%, transparent);
      color: var(--status-no-plan);
    }
    .status-planning {
      background: color-mix(in srgb, var(--status-planning) 20%, transparent);
      color: var(--status-planning);
    }
    .status-in-progress {
      background: color-mix(in srgb, var(--status-in-progress) 20%, transparent);
      color: var(--status-in-progress);
    }
    .status-idle {
      background: color-mix(in srgb, var(--status-idle) 20%, transparent);
      color: var(--status-idle);
    }

    .divergence { font-size: 12px; color: var(--text-muted); }

    .divergence-summary {
      display: flex;
      align-items: center;
      gap: 12px;
    }

    .file-changes { display: flex; gap: 8px; }
    .file-added { color: #3fb950; }
    .file-modified { color: #d29922; }
    .file-deleted { color: #f85149; }

    .commit-list {
      list-style: none;
      max-height: 120px;
      overflow-y: auto;
      margin-top: 6px;
    }

    .commit-list li {
      padding: 2px 0;
      border-bottom: 1px solid var(--border);
      color: var(--text-muted);
      font-size: 12px;
    }

    .commit-list li:last-child { border-bottom: none; }

    .commit-hash {
      color: var(--text-dim);
      font-size: 11px;
      margin-right: 6px;
    }

    .plan-section {
      border-top: 1px solid var(--border);
      padding-top: 8px;
    }

    .plan-toggle {
      background: none;
      border: none;
      color: var(--text-muted);
      cursor: pointer;
      font-family: var(--font-mono);
      font-size: 12px;
      display: flex;
      align-items: center;
      gap: 4px;
      padding: 4px 0;
    }

    .plan-toggle:hover { color: var(--text); }

    .plan-toggle .arrow {
      transition: transform 0.15s ease;
      display: inline-block;
    }

    .plan-toggle .arrow.expanded { transform: rotate(90deg); }

    .card.plan-expanded {
      grid-column: 1 / -1;
    }

    .plan-content {
      display: none;
      padding: 12px 16px;
      background: var(--bg);
      border-radius: 4px;
      margin-top: 8px;
      font-size: 13px;
    }

    .plan-content.expanded { display: block; }

    .plan-content h1, .plan-content h2, .plan-content h3 {
      color: var(--text);
      margin: 8px 0 4px;
      font-size: 14px;
    }
    .plan-content h1 { font-size: 16px; }
    .plan-content p { margin: 4px 0; color: var(--text-muted); }
    .plan-content ul, .plan-content ol { padding-left: 20px; color: var(--text-muted); }
    .plan-content li { margin: 2px 0; }
    .plan-content code {
      background: var(--bg-card);
      padding: 1px 4px;
      border-radius: 3px;
      font-size: 12px;
    }
    .plan-content pre {
      background: var(--bg-card);
      padding: 8px;
      border-radius: 4px;
      overflow-x: auto;
      margin: 4px 0;
    }
    .plan-content pre code { background: none; padding: 0; }

    .empty-state {
      text-align: center;
      color: var(--text-dim);
      padding: 80px 16px;
      font-size: 14px;
    }
  </style>
</head>
<body>
  <header>
    <h1>work-for-the-trees</h1>
    <span id="connection-status" class="status-dot"></span>
    <span id="repo-path"></span>
    <span id="last-updated"></span>
  </header>

  <main id="grid" class="card-grid"></main>

  <div id="empty-state" class="empty-state" style="display:none">
    <p>No worktrees found. Waiting for data...</p>
  </div>

  <script>
    (function () {
      const grid = document.getElementById("grid");
      const emptyState = document.getElementById("empty-state");
      const connectionDot = document.getElementById("connection-status");
      const repoPathEl = document.getElementById("repo-path");
      const lastUpdatedEl = document.getElementById("last-updated");
      const expandedPlans = new Set();

      function connect() {
        const protocol = location.protocol === "https:" ? "wss:" : "ws:";
        const ws = new WebSocket(`${protocol}//${location.host}/ws`);

        ws.onopen = () => connectionDot.classList.add("connected");

        ws.onclose = () => {
          connectionDot.classList.remove("connected");
          setTimeout(connect, 2000);
        };

        ws.onerror = () => ws.close();

        ws.onmessage = (event) => {
          try {
            render(JSON.parse(event.data));
          } catch (err) {
            console.error("Failed to parse message:", err);
          }
        };
      }

      function render(state) {
        repoPathEl.textContent = state.repoPath;
        lastUpdatedEl.textContent = "Updated " + new Date(state.updatedAt).toLocaleTimeString();

        if (!state.worktrees || state.worktrees.length === 0) {
          grid.style.display = "none";
          emptyState.style.display = "block";
          return;
        }

        grid.style.display = "grid";
        emptyState.style.display = "none";

        const sorted = [...state.worktrees].sort((a, b) => {
          if (a.isMainWorktree) return 1;
          if (b.isMainWorktree) return -1;
          const order = { "in-progress": 0, "planning": 1, "idle": 2, "no-plan": 3 };
          return (order[a.status] ?? 4) - (order[b.status] ?? 4);
        });

        grid.innerHTML = sorted.map(renderCard).join("");

        grid.querySelectorAll(".plan-toggle").forEach((btn) => {
          btn.addEventListener("click", () => {
            const key = btn.dataset.key;
            const content = btn.nextElementSibling;
            const arrow = btn.querySelector(".arrow");
            const card = btn.closest(".card");

            if (expandedPlans.has(key)) {
              expandedPlans.delete(key);
              content.classList.remove("expanded");
              arrow.classList.remove("expanded");
            } else {
              expandedPlans.add(key);
              content.classList.add("expanded");
              arrow.classList.add("expanded");
            }

            // Card spans full width if any of its plans are expanded
            const hasExpanded = card.querySelector(".plan-content.expanded");
            card.classList.toggle("plan-expanded", !!hasExpanded);
          });
        });
      }

      function renderCard(wt) {
        const mainClass = wt.isMainWorktree ? " main-worktree" : "";
        const hasExpandedPlan = wt.planFiles.some(
          (p) => expandedPlans.has(wt.branch + ":" + p.filename)
        );
        const expandedCardClass = hasExpandedPlan ? " plan-expanded" : "";
        const statusClass = "status-" + wt.status;
        const statusLabels = {
          "no-plan": "No plan",
          "planning": "Planning",
          "in-progress": "In progress",
          "idle": "Idle",
        };

        return `
          <div class="card${mainClass}${expandedCardClass}">
            <div class="card-header">
              <div>
                <div class="branch-name">${esc(wt.branch)}</div>
                ${wt.baseBranch ? `<div class="base-branch">from ${esc(wt.baseBranch)}</div>` : ""}
              </div>
              <span class="status-badge ${statusClass}">${statusLabels[wt.status] || wt.status}</span>
            </div>
            ${renderDivergence(wt)}
            ${renderPlans(wt)}
          </div>
        `;
      }

      function renderDivergence(wt) {
        if (wt.commitsAhead === 0) return "";

        const fc = wt.fileChanges;
        const parts = [];
        if (fc.added > 0) parts.push(`<span class="file-added">+${fc.added}</span>`);
        if (fc.modified > 0) parts.push(`<span class="file-modified">~${fc.modified}</span>`);
        if (fc.deleted > 0) parts.push(`<span class="file-deleted">-${fc.deleted}</span>`);

        const commits = wt.commits.map((c) =>
          `<li><span class="commit-hash">${c.hash.slice(0, 7)}</span>${esc(c.message)}</li>`
        ).join("");

        return `
          <div class="divergence">
            <div class="divergence-summary">
              <span>${wt.commitsAhead} commit${wt.commitsAhead !== 1 ? "s" : ""} ahead</span>
              ${parts.length ? `<span class="file-changes">${parts.join(" ")} files</span>` : ""}
            </div>
            <ul class="commit-list">${commits}</ul>
          </div>
        `;
      }

      function renderPlans(wt) {
        if (wt.planFiles.length === 0) return "";

        return wt.planFiles.map((plan) => {
          const key = wt.branch + ":" + plan.filename;
          const isExpanded = expandedPlans.has(key);
          const expandedClass = isExpanded ? " expanded" : "";

          return `
            <div class="plan-section">
              <button class="plan-toggle" data-key="${esc(key)}">
                <span class="arrow${expandedClass}">&#9654;</span>
                ${esc(plan.filename)}
              </button>
              <div class="plan-content${expandedClass}">
                ${marked.parse(plan.content)}
              </div>
            </div>
          `;
        }).join("");
      }

      function esc(str) {
        const div = document.createElement("div");
        div.textContent = str;
        return div.innerHTML;
      }

      connect();
    })();
  </script>
</body>
</html>
